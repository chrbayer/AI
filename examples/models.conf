# Embeddings for retrieval and agent memory: POST /v1/embeddings (OpenAI).
# Last-token pooling is what Qwen3-Embedding was trained with. A pooled input
# has to fit into one physical batch, hence -ub/-b at the context size.
# Instruction-aware: prefix queries (not documents) with
# "Instruct: <task>\nQuery: " for the best retrieval.
_model_name="embed"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/qwen3-embedding/Qwen3-Embedding-8B-Q8_0.gguf"
_model_mmproj=""
_model_alias="qwen3-embedding"
_model_label="Qwen3-Embedding 8B (embeddings)"
_model_ctx="8192"
_model_extra_args=(--embedding --pooling last -ub 8192 -b 8192 "${_common[@]}")
_model_client_name="qwen3-embedding"
_model_rocm_env=""
_model_hf_repo="Qwen/Qwen3-Embedding-8B-GGUF"
_model_hf_includes=("Qwen3-Embedding-8B-Q8_0.gguf")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="none"
_model_reasoning_levels=""
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model

# Reranking: POST /v1/rerank {"query", "documents"} gives each document a
# relevance score — the second pass after an embedding search.
_model_name="rerank"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/qwen3-reranker/qwen3-reranker-0.6b-q8_0.gguf"
_model_mmproj=""
_model_alias="qwen3-reranker"
_model_label="Qwen3-Reranker 0.6B (reranking)"
_model_ctx="8192"
_model_extra_args=(--reranking -ub 8192 -b 8192 "${_common[@]}")
_model_client_name="qwen3-reranker"
_model_rocm_env=""
_model_hf_repo="ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF"
_model_hf_includes=("qwen3-reranker-0.6b-q8_0.gguf")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="none"
_model_reasoning_levels=""
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model
