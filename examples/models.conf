add_model

# MiniMax-M2.7
_model_name="minimax"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/MiniMax-M2.7-GGUF/UD-IQ3_S/MiniMax-M2.7-UD-IQ3_S-00001-of-00003.gguf"
