# Qwen3.8-Flash-Next (125B MoE) — halogen-flash-server, 4-bit, Strix Halo only.
# Not a GGUF: halogen's own .hgn weights, run by a closed-source engine written
# for gfx1151 and shipped as a container. It needs most of the machine (~62 GiB
# of weights pinned, ~20 GiB of KV pool and working memory), so other slots
# start beside it only when they fit, and it always runs with its proxy. Since 0.15.1 the server speaks the
# Messages API Claude Code uses itself; the proxy passes it through and caps
# token budgets (LLMCTL_HALOGEN_TRANSLATE=1 brings back its own translation).
#
# The checkpoint is v2 (0.15.0): one file with no quality sidecar, closer to the
# original model than 0.14's w4b with its sidecar, ~3.5 GiB less in memory. The
# model's n-gram lookup table sits beside it as a file of its own.
#
# 0.16.1 (faster decode, prompt-cache fixes): decode 42.7-44.1 t/s prose, 60.4-64.1
# code against 41.8-42.3 / 58.6-63.1 on 0.16.0 the same evening, prefill the same,
# 40 answers at temperature 0 byte for byte as 0.16.0.
# 0.16.2 (prompt cache keeps each conversation's latest point and a shared system
# prompt when full; NPU additions unused here): prefill 1217-1246 / 1569-1652 /
# 1578-1586 / 1621-1623 t/s at 850 / 6.6K / 26K / 53K tokens against 1136-1240 /
# 1552-1575 / 1558-1567 / 1603-1611 on 0.16.1 the same morning, decode 41.8-44.5
# prose, 64.6-64.7 code against 40.9-42.5 / 60.1-65.1, memory the same (62.1 GiB
# pinned, 20.1 GTT), its 40 answers at temperature 0 byte for byte as 0.16.1.
# Measured on this machine (0.16.0 with v2 and vision, two runs): prefill
# 1229-1241 t/s at 850 tokens, 1573-1647 at 6.6K, 1579-1587 at 26K, 1576-1624
# at 53K, decode 42 t/s on prose and 63 on code (MTP draft on, greedy), first
# streamed token after 0.18 s — 0.15.3 the same within the spread, and its
# answers to 40 prompts at temperature 0 byte for byte the same.
# The smaller checkpoint 0.16.0 offers, qwen38-flash-next-ht43.hgn (experts in
# fewer bits, 53.7 GiB), pinned 54.5 GiB instead of 62.9 and left 40.1 GiB
# really available instead of 31.7, but read prompts 6-9 % slower (1121-1126,
# 1456-1522, 1476-1487, 1514-1516 t/s) and decoded 2 % slower on prose, 7 % on
# code (41.5 and 58.6 t/s). Its answers: all 20 sums and facts the same and
# right, but 15 of 40 answers went their own way (9 of 10 German texts, 6 of 10
# code answers): an ISO-date regex that no longer checks month and day, a
# grammar slip ("zum Flick eines Fahrradschlauchs"). v2 stays.
# With fragmented
# host memory prefill collapsed to 8-370 t/s — `start --compact` or a reboot
# fixes that.
#
# 256K context with a pool of the same size and 2 slots: 81.7 GiB in all (62.1
# weights, 7.2 KV pool, 12.4 working memory; 0.15.2 counts the 0.8 GiB vision
# tower too when --mmproj loads it), which leaves ~30 GiB for the page
# cache the 47.7 GiB n-gram table is read through (0.14.2 with w4b: 96.3 GiB,
# ~8 GiB left). The server's own default (pool 2x ctx, 4 slots) takes more and
# leaves less, and long prompts page from disk.
# --ctx 524288 turns on YaRN x2 (every position encodes differently from the
# trained model) and raises the pool with it.
_model_name="flash"
_model_backend="halogen"
_model_binary="ghcr.io/peonist-ai/halogen-flash-server:0.16.2"
_model_model="$MODELS_DIR/halogen-qwen3.8-flash-next/qwen38-flash-next-v2.hgn"
_model_mmproj="$MODELS_DIR/halogen-qwen3.8-flash-next/qwen38-flash-next-vision.hgn"
_model_alias="halogen-qwen3.8-flash-next"
_model_label="Qwen3.8-Flash-Next (halogen)"
_model_ctx="262144"
# HALOGEN_CACHE_BRANCHES=3 (0.13.3, default 2): branches of one conversation the
# prompt cache keeps resume points for. Two is a conversation and one side turn;
# three is a parent forked into two children, which is what Claude Code running
# subagents does — on two, the parent's resume point is the one dropped. Costs
# ~0.8 GiB of host memory (the entry cap is derived from it).
# HALOGEN_WEIGHTS_LOCK=1 (0.13.2) would mlock the weights. Measured here against
# a co-tenant growing in 5 GiB steps: without it, prefill fell from 1084 to 947
# tok/s at 10 GiB and the engine wedged at 15 GiB — no answer for 180 s, then its
# own watchdog took it down. With it, prefill held (1179 tok/s at 15 GiB) and the
# co-tenant was killed instead. It stays off all the same: the weights are clean
# file pages, so reclaiming them writes nothing and costs re-reads, while locking
# them leaves only anonymous memory to reclaim, which goes to swap — and this
# host's swap file is on the SSD, which filled during that test. A killed server
# can be started again; SSD writes do not come back. Other slots start beside
# it only when they fit, so the pressure can only come from outside llmctl.
# HALOGEN_PREFILL_KEEP_TRUNK=1 (0.15.2) keeps the trunk unpacked, 5.5 GiB more
# working memory, for faster prefill on long prompts. Measured here, two runs:
# no gain at 850, 6.6K or 26K tokens, and 25 GiB really available instead of 31.
# Left off.
_model_extra_args=(HALOGEN_KV_POOL_POSITIONS=262144 HALOGEN_KV_SLOTS=2
    HALOGEN_CACHE_BRANCHES=3)
_model_client_name="halogen-qwen3.8-flash-next"
_model_rocm_env=""
_model_hf_repo="peonist-ai/halogen-qwen3.8-flash-next"
# The checkpoint and, beside it, the n-gram lookup table it reads through the
# page cache; the vision tower and the tokenizer.
_model_hf_includes=("qwen38-flash-next-v2.hgn" "qwen38-flash-next-ngram.hgn"
    "qwen38-flash-next-vision.hgn" "tokenizer/*")
_model_hf_dir=""
_model_no_reasoning_args=()
# Server-side default effort is xhigh; the template takes low/medium/high/xhigh.
_model_reasoning="effort"
_model_reasoning_levels="low=low medium=medium high=high max=xhigh"
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model

