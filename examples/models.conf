#!/bin/bash
# Model definitions — source this file, then call add_model per entry.
#
# Fields:
#   name         — short identifier, used with llmctl
#   binary       — llama-server binary (default: llama-server)
#   model        — path to .gguf file
#   mmproj       — path to mmproj file (omit if none)
#   alias        — model alias passed to --alias
#   label        — human-readable name for listing
#   ctx          — context window size, passed as --ctx-size (per model; the hard
#                  upper bound for the client. KV-cache grows linearly with this.)
#   extra_args   — additional llama-server flags (bash array; do NOT put -c,
#                  --parallel or --timeout here — those are set centrally by llmctl)
#   client_name  — the model name Claude Code sends to the API
#                  (omit to use the same value as alias)
#   rocm_env     — space-separated KEY=VAL pairs for ROCm env (empty = Vulkan)
#   hf_repo           — HuggingFace repo for download (e.g. unsloth/Qwen3-GGUF)
#   hf_includes       — space-separated glob patterns for hf download --include
#   no_reasoning_args — extra llama-server args appended when reasoning is turned off (optional)
#   reasoning    — what the model's chat template actually supports, which decides
#                  how llmctl translates --reasoning:
#                    none        template has no thinking at all
#                    toggle      template reads enable_thinking (on/off + budget)
#                    effort      toggle plus reasoning_effort/reasoning_strength (levels)
#                    locked-off  template hard-codes thinking closed; nothing to steer
#                    unknown     not verified yet (model not downloaded) — flags are
#                                passed through and start prints a note
#   reasoning_levels — only for `effort`: maps the unified low|medium|high|max scale to
#                  the level names this template accepts. Templates raise on unknown
#                  names, so an unmapped level is refused rather than passed on.
#   backend      — llama (default: llama-server) or halogen (halogen-flash-server in
#                  podman). Reset after every add_model, so an entry that omits it is
#                  always llama. For halogen some fields mean something else:
#                    binary      the container image
#                    model       the .hgn checkpoint; its directory is mounted as
#                                /models and must also hold tokenizer/ (and the
#                                n-gram table and vision files, found beside it)
#                    mmproj      the vision .hgn — must sit beside the checkpoint
#                    alias       the model id the server reports
#                    extra_args  HALOGEN_*=VALUE pairs for the container environment
#                    rocm_env, no_reasoning_args, spec_args — unused
#                  or comfyui (ComfyUI, the image generator; no LLM, but it shares the
#                  GPU memory and so takes a slot). For comfyui:
#                    binary      the ComfyUI checkout, with its .venv beside main.py;
#                                its parent directory holds user/ (settings and
#                                workflows), input/, output/ and temp/
#                    model       the directory the image models live in
#                    extra_args  additional ComfyUI flags
#                    rocm_env    as for llama: KEY=VAL pairs for its environment
#                    hf_*        unused — `download` sets the checkout up and fetches
#                                the models its workflows name
#                  or audiocpp (audio.cpp's server: speech recognition, also live).
#                  For audiocpp: binary is audiocpp_server (built by `download` from
#                  a pinned commit), model the GGUF, client_name the model id (the
#                  live one is <id>-live), extra_args family=<audio.cpp family>
#                  task=<asr|…> as KEY=VAL.
#                  or tts (speech: llama-tts behind tts_server.py, OpenAI speech API).
#                  For tts: binary is llama-tts, model the Qwen3-TTS Base GGUF, mmproj
#                  its mmproj GGUF, client_name the model id, extra_args llama-tts flags.

add_model() {
    _MODELS+=("$_model_name|$_model_binary|$_model_model|$_model_mmproj|$_model_alias|$_model_label|${_model_extra_args[*]}|$_model_client_name|$_model_rocm_env|$_model_hf_repo|${_model_hf_includes[*]}|$_model_hf_dir|${_model_no_reasoning_args[*]}|$_model_ctx|$_model_reasoning|$_model_reasoning_levels|${_model_spec_args[*]}|$_model_hf_draft|$_model_hf_mmproj|$_model_backend")
    _model_backend=""
}

# ── Default binary ──────────────────────────────────────────
# The builds `llmctl download llama` installs and `update llama` moves on with each
# stable llama.cpp release: Vulkan from ggml-org, ROCm from lemonade-sdk for this
# GPU. Measured against self-built ones at the same release (v0.5.0, -fa 1, pp512
# and tg128): qwen-moe 1094/46.4 t/s Vulkan (own build 1083/47.1), 979/42.5 ROCm
# (lemonade b1335 in /opt: 1005/43.3); qwen 27B 304/7.27 (311/7.28), 329/7.12
# (333/7.15) — the same within the spread.
LLAMA_DEFAULT_BIN="${LLMCTL_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/llmctl}/llama.cpp/vulkan/current/llama-server"
LLAMA_ROCM_BIN="${LLMCTL_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/llmctl}/llama.cpp/rocm/current/llama-server"

# ── Common config (infrastructure, identical for every model; never tuned) ──
# Pure runtime config, not a per-model setting. Samplers (temp/top-p/…) and
# --cache-type-k/v live in each model's extra_args instead.
# --poll 0 stops the worker threads spinning on GPU completions. Measured over
# ten configurations (every model, with and without speculation): throughput
# moves by at most 2%, mostly by nothing at all, while CPU drops from 730-1400%
# to 22-49% — seven to fourteen cores handed back to the rest of the machine.
# Idle waiting is highest without speculation, since more time is spent per token.
# --load-mode mlock reads the weights without mmap and locks them in memory, so
# nothing gets paged out (replaces the former --no-mmap/--mlock pair).
_common=(--jinja --flash-attn on --cache-prompt --threads 16 --load-mode mlock -ngl 99 --poll 0)

# Default ROCm env vars (empty = no ROCm env vars set, uses Vulkan)
_default_rocm_env="ROC_ENABLE_PREFETCH=1 HSA_ENABLE_COMPRESSION=1 HSA_ENABLE_SDMA=0"

# ── Models ──────────────────────────────────────────────────

# Qwen3.6-35B-A3B (MoE) uncensored
_model_name="qwen-moe"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-GGUF/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf"
_model_mmproj="$MODELS_DIR/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-GGUF/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf"
_model_alias="HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
_model_label="Qwen3.6-35B-A3B MoE Unc"
_model_ctx="65536"   # coding model; MoE → tiny KV (~43KB/tok), fits easily
_model_extra_args=(--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00
    --presence_penalty 0.00 --repeat_penalty 1.00
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
_model_hf_includes=("*Q8_K_P*" "*mmproj*")
_model_hf_dir=""
_model_no_reasoning_args=(--temp 0.7 --top-p 0.80 --presence_penalty 1.50)
_model_reasoning="toggle"
_model_reasoning_levels=""
# No speculation: measured on qwen-moe at 44.58 t/s without it and 4.55 with
# (Qwen3.8-4B draft, n-max 4) — a tenfold loss. An MoE reads only its active
# experts per token, so it is fast to begin with and a draft costs more than
# the tokens it saves; batched verification also routes each token to its own
# experts, widening the read instead of sharing it. Do not add spec_args here.
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model


# Qwen3.8-27B (dense) uncensored — HauhauCS Q8, picked for its draft head.
# Named plainly "qwen": it replaced the 3.6-27B entry outright, being the same
# HauhauCS line with finer reasoning control and twice the speed.
_model_name="qwen"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf"
_model_mmproj="$MODELS_DIR/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/mmproj-Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-BF16.gguf"
_model_alias="HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive"
_model_label="Qwen3.8-27B Unc"
_model_ctx="65536"   # same hybrid stack as 3.6-27B (16 of 64 layers hold KV), native 262K
# Q8 over the smaller 0xKitkat Q6_K only because of speculative decoding. On raw
# bandwidth Q8 loses (7.22 vs 8.07 t/s, it is 4 GB more to read per token), but
# its MTP head is Q8 too and lands 61% of its drafts against the Q6 head's 47%.
# That margin pays for one extra draft step, and the deeper draft more than
# covers the bandwidth: 15.48 vs 14.85 t/s. See _model_spec_args below.
#
# This GGUF carries Qwen's stock template, so unlike the 0xKitkat one it needs no
# repair — templates/qwen3.8-unc.jinja is still that stock template, kept here
# purely for the uncensored system default it adds. Samplers follow the model
# card's thinking-on set, with the thinking-off set in _model_no_reasoning_args.
_model_extra_args=(--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00
    --presence_penalty 0.00 --repeat_penalty 1.00
    --chat-template-file "$SHARE_DIR/templates/qwen3.8-unc.jinja"
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF"
_model_hf_includes=("*Q8_K_P*" "*mmproj*")
_model_hf_dir=""
_model_no_reasoning_args=(--temp 0.7 --top-p 0.80 --presence_penalty 1.50)
_model_reasoning="effort"
# The template knows low/medium/xhigh only, so high and max both land on xhigh.
_model_reasoning_levels="low=low medium=medium high=xhigh max=xhigh"
# The MTP head sits in blk.64 of this very GGUF; without --spec-type it is
# skipped at load ("unused tensor ... ignoring"). 7.22 -> 15.48 t/s for +3.5 GB.
# n-max 4 is the peak, bracketed on both sides (3:14.4, 4:15.5, 5:15.2, 6:14.9,
# 8:11.0) — the Q6 head could not afford that fourth step, this one can.
_model_spec_args=(--spec-type draft-mtp --spec-draft-n-max 4)
_model_hf_draft=""
_model_hf_mmproj=""
add_model

# The same Qwen3.8-27B on gufo (backend "gufo", github.com/gufo-org/gufo), an
# engine written for Strix Halo, with z-lab's DFlash2 draft instead of the MTP
# head (gufo runs MTP for Flash-Next only). Measured against "qwen" on
# llama.cpp, same GGUF, same bench (halogen_bench.py), greedy:
#   prefill 850 / 6.6K / 26K tokens: 368 / 388 / 365 t/s (llama.cpp 312 / 286 / 247)
#   decode prose / code:             14.1 / 35.6 t/s     (llama.cpp 11.8 / 19.0)
#   first token 0.39 s; without the draft gufo decodes at 7 t/s, the bandwidth
#   limit for 29 GiB of Q8 weights.
# gufo 0.5.0 (cache reuse that keeps up with growing conversations, tool
# schemas kept) measured as 0.4.0 within the spread — prefill 332-384 / 372-384 /
# 360 / 340 t/s at 850 / 6.6K / 26K / 53K, decode 15.4-15.9 prose, 36-37.5 code —
# and answered 40 prompts at temperature 0 byte for byte as 0.4.0.
# HauhauCS's Q8_K_P runs as fast as unsloth's UD-Q8_K_XL, gufo's own target.
# Memory, two sessions: the weights 31 GiB as the container's RAM, the KV in GTT
# reserved at start — 41 / 45 / 54 / 68 GiB in all at 32K / 64K / 128K / 256K
# context per session (--ctx 262144 for the native window). gufo takes the
# GGUF's own chat template; templates/qwen3.8-unc.jinja (the uncensored system
# default "qwen" adds) does not apply here.
_model_name="qwen-gufo"
_model_backend="gufo"
_model_binary="ghcr.io/gufo-org/toolboxes/gufo-runtime:0.5.0"
_model_model="$MODELS_DIR/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf"
_model_mmproj="$MODELS_DIR/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/mmproj-Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-BF16.gguf"
_model_alias="HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive"
_model_label="Qwen3.8-27B Unc (gufo)"
_model_ctx="65536"
# gufo serve llm flags: the model card's thinking-on samplers.
_model_extra_args=(--temperature 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0)
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF"
_model_hf_includes=("*Q8_K_P*" "*mmproj*")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="effort"
_model_reasoning_levels="low=low medium=medium high=high max=max"
_model_spec_args=(--speculative dflash2
    --dflash-model "$MODELS_DIR/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf")
_model_hf_draft="z-lab/Qwen3.8-27B-DFlash2-GGUF Qwen3.8-27B-DFlash2-Q4_K_M.gguf"
_model_hf_mmproj=""
add_model

# Qwen3-VL-8B (vision-language) uncensored
_model_name="qwen-vl"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive-GGUF/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive-Q8_0.gguf"
_model_mmproj="$MODELS_DIR/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive-GGUF/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive-mmproj-f16.gguf"
_model_alias="HauhauCS/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive"
_model_label="Qwen3-VL-8B Unc"
_model_ctx="8192"     # native max 256K, but 8k is plenty here; runs parallel to llama3.3
_model_extra_args=(--temp 0.2 --top-p 1.0 --top-k -1 --min-p 0.05
    --presence_penalty 0.00 --repeat_penalty 1.1 --repeat-last-n 64
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="HauhauCS/Qwen3VL-8B-Uncensored-HauhauCS-Aggressive"
_model_hf_includes=("*Q8_0*" "*mmproj*")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="none"
_model_reasoning_levels=""
# No speculation, even though it works and pays on text: 25.4 t/s plain against
# 34-39 with a Qwen3-0.6B draft (identical vocab, 1:14 by size). Any prompt with an
# image then dies with HTTP 500, "failed to process speculative batch". The server
# passes the draft only the text tokens (get_text_tokens() drops the image
# placeholders), so the draft's KV cache sits at position 4 while the target
# resumes at 52 behind 48 image tokens, and a batch whose positions are not
# consecutive is refused. Independent of the draft's quant. Do not add spec_args
# here - it would trade the model's whole purpose for 1.3-1.5x on text.
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model

# Muse-Glimmer-30B Abliterated Aggressive (jorkle), Meta base + de-refusal LoRA
# Needs the muse-glimmer arch, merged 10 Aug 2026 and first shipped in b10353.
# The Vulkan build has it; the ROCm build in /opt predates it (no muse-glimmer
# symbols), so `bench muse` will fail on its ROCm half. Reasoning strength is not
# a server flag here — it goes into the system prompt as
# "Reasoning strength: low|medium|high|xhigh", so --reasoning-budget does nothing.
# The aggressive twin drifts ~1.7x further from base than the normal variant
# (KL 0.17) and its capabilities were not re-benchmarked.
_model_name="muse"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/Muse-Glimmer-30B-Abliterated-Aggressive-GGUF/Muse-Glimmer-30B-Abliterated-Aggressive.Q8_0.gguf"
_model_mmproj="$MODELS_DIR/Muse-Glimmer-30B-Abliterated-Aggressive-GGUF/Muse-Glimmer-30B-Abliterated-Aggressive.mmproj-f16.gguf"
_model_alias="jorkle/Muse-Glimmer-30B-Abliterated-Aggressive"
_model_label="Muse-Glimmer-30B Unc"
_model_ctx="131072"   # native 131072+
# Samplers from the Meta base card; the abliteration does not change them.
_model_extra_args=(--temp 1.0 --top-p 0.95 --top-k 64
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="mradermacher/Muse-Glimmer-30B-Abliterated-Aggressive-GGUF"
_model_hf_includes=("Muse-Glimmer-30B-Abliterated-Aggressive.Q8_0.gguf"
    "Muse-Glimmer-30B-Abliterated-Aggressive.mmproj-f16.gguf")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="effort"
_model_reasoning_levels="low=low medium=medium high=high max=xhigh"
_model_spec_args=()
_model_hf_draft=""
_model_hf_mmproj=""
add_model

# Gemma-4-31B-it (uncensored)
_model_name="gemma"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/gemma-4-31B-it-uncensored-GGUF/gemma-4-31B-it-uncensored-Q8_0.gguf"
# The uncensored repo ships no vision projector, so this one comes from the
# stock repo. Measured: the abliterated model describes a test image exactly
# as stock does with its own projector — abliteration moves the text tower,
# not the vision path, and both sides are 5376-dimensional.
_model_mmproj="$MODELS_DIR/gemma-4-31B-it-uncensored-GGUF/mmproj-F16.gguf"
_model_alias="TrevorJS/gemma-4-31B-it-uncensored"
_model_label="Gemma-4-31B-it Unc"
_model_ctx="131072"   # general use; sliding-window attn keeps KV modest
_model_extra_args=(--temp 1.0 --top-p 0.95 --top-k 64
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="TrevorJS/gemma-4-31B-it-uncensored-GGUF"
_model_hf_includes=("*Q8_0*")
_model_hf_dir=""
_model_no_reasoning_args=()
_model_reasoning="toggle"
_model_reasoning_levels=""
# Dense, so speculation works: 6.62 -> 11.91 t/s (1.80x) with gemma-4-E2B as
# the draft, 36% acceptance, tokenizer verified identical by hash (262144).
_model_spec_args=(--spec-type draft-simple -md "$MODELS_DIR/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q4_K_M.gguf" --spec-draft-n-max 4)
_model_hf_draft="unsloth/gemma-4-E2B-it-GGUF *Q4_K_M.gguf*"
# Second repo: the projector ships with the stock model, not the uncensored one.
_model_hf_mmproj="unsloth/gemma-4-31B-it-GGUF *mmproj-F16.gguf*"
add_model

# Gemma-4-26B-A4B-it (MoE, uncensored)
_model_name="gemma-moe"
_model_binary="$LLAMA_DEFAULT_BIN"
_model_model="$MODELS_DIR/gemma-4-26B-A4B-it-uncensored-GGUF/gemma-4-26B-A4B-it-uncensored-Q8_0.gguf"
