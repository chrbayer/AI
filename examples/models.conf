_model_ctx="32768"
_model_extra_args=(--temp 1.00 --top-p 1.00 --min-p 0.05 --repeat-penalty 1.1
    --cache-type-k q8_0 --cache-type-v q8_0 "${_common[@]}")
_model_client_name=""
_model_rocm_env=""
_model_hf_repo="mradermacher/Llama-3.3-70B-Instruct-abliterated-GGUF"
