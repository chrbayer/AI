#!/bin/bash
# Preset definitions — source this file, then call add_preset per entry.
#
# A preset is one named LLM configuration: which models run, on which slot, with
# which start flags. `llmctl preset <name>` brings the whole set up in one go,
# `llmctl presets` lists what is defined here.
#
# Fields:
#   name     — short identifier, used with `llmctl preset <name>`
#   label    — one line describing the configuration, shown by `llmctl presets`
#   entries  — one line per model, holding exactly what would follow `llmctl start`:
#                "<model> <slot> [start flags ...]"
#              Model and slot come first and are both required; everything after
#              them is handed to start untouched, so every flag start knows works
#              here and no option list has to be kept in sync with it.
#              Lines are split on whitespace and stored separated by "|", so an
#              argument may contain neither a space nor a "|".
#              Slots must differ within a preset — one server per slot.
#
# `llmctl preset <name>` does not start blindly: it compares each slot against
# what it should run (flag by flag, against the running process's own argv) and
# then keeps what already matches, stops what differs or is not named here, and
# starts only what is missing. A preset therefore describes the whole machine,
# not just an addition to it.
#
# What a preset does NOT do: check that the models fit into GPU memory together. It
# starts them one after another and waits for each to listen before loading the
# next, so an over-committed set fails on the model that no longer fits rather
# than taking the machine down with it — but the sizes are yours to add up.

add_preset() {
    local IFS='|'
    _PRESETS+=("$_preset_name|$_preset_label|${_preset_entries[*]}")
}

# ── Presets ─────────────────────────────────────────────────

# Coding: the dense Qwen on its own, with the whole machine to itself.
#
# Context stays at the model's own 65536 default, so no --ctx here. The last real
# session on this model (logs/server-1.log, 28 Aug) reached 54446 tokens, a third
# of its tasks went past 32768, and nothing was truncated — 32K would have cut
# that session short. It costs almost nothing to leave it at 64K: only 16 of this
# model's 64 layers hold KV at all, so the cache is a couple of GB against 30 GB
# of weights.
#
# Memory on this machine (since 2026-09): the BIOS carves out only 1 GiB of VRAM,
# and the GPU takes everything else as GTT out of the same 124.4 GiB the system
# sees, up to the 104 GiB that ttm.pages_limit=27262976 allows. So weights, KV,
# the host-RAM prompt cache and the rest of the system all draw on one pool.
# (Until then it was 96 GiB of VRAM, 8 GiB of GTT and ~30 GB left for the system;
# the measurements below that name VRAM were taken under that split.)
#
# Speculation needs no flag either: the MTP draft head ships inside this GGUF and
# is on by default wherever models.conf declares it (7.22 -> 15.48 t/s for
# +3.5 GB). Only turning it off would take one.
#
# --cache-ram 4096 halves the server's 8192 MiB default. The prompt cache lives in
# host RAM, which is now the same pool the two models' weights come out of, so
# every GiB it holds is one the GPU cannot have. Estimated at a
# handful of full-length sessions: llama3.3's measured cache entries run
# 1.3-1.6 GiB, and this model's KV is far smaller per token, all 80 of llama3.3's
# layers holding KV against 16 of 64 here. `cache-stats` after a session says
# whether 4096 is generous or tight.
#
# --proxy is what keeps that cache warm: Claude Code stamps every request with the
# time and date, and rewriting those stamps is the proxy's whole job.
#
# --reasoning high lands on the template's xhigh, which is also what it uses when
# nothing is passed (reasoning_effort|default('xhigh') in qwen3.8-unc.jinja). It
# is written out so the depth is visible in `status` and in the log header, and so
# a template change cannot quietly lower it.
#
# The MoE next to it answers everything that does not need the big model, and is
# tuned the other way round: thinking off, because a <think> loop costs more time
# than the answer, and near-deterministic sampling for code. --reasoning off also
# brings the model's own non-thinking sampler set (temp 0.7, top-p 0.80), so the
# temperature has to be said explicitly afterwards — 0.1 rather than 0.0, which
# leaves a hair of room against degenerate repetition. Its context is the model's
# own 65536 default, so no --ctx here either; MoE KV is tiny (~43 KB/token).
# No speculation for it, deliberately — see the note in models.conf.
#
# Together: ~30 GB + ~41 GB of weights plus their caches, roughly 80 of the 104 GiB
# the GPU may take, which leaves ~44 GiB of the 124.4 for the system and both
# prompt caches. The two --cache-ram caps promise 6 GiB of that, and that is a cap
# rather than a reservation — `cache-stats` says what is really used. (The 80 is
# the estimate from the old VRAM split; not re-measured since.)
_preset_name="coding"
_preset_label="Qwen3.8-27B dense at xhigh, MoE next to it for quick deterministic answers"
_preset_entries=(
    "qwen     1 --proxy --cache-ram 4096 --ctx 131072 --reasoning high"
    "qwen-moe 2 --proxy --cache-ram 2048 --ctx 131072 --reasoning off --temp 0.1 --top-p 0.8"
)
add_preset

# Captured from the running configuration on 2026-09-05: both entries were
# verified to reproduce the two servers' own argv flag for flag.
# qwen-vl is 8B at 8K context precisely so it can sit next to a 70B — see the
# ctx note in models.conf. --mmproj is what makes it read images at all.
_preset_name="c4f"
_preset_label="Llama-3.3-70B with Qwen3-VL-8B next to it for images"
_preset_entries=(
    "llama3.3 2 --parallel 5 --ctx 61440 --similarity 0.92"
    "qwen-vl  3 --mmproj"
)
add_preset

# A preset need not hold more than one model: this is simply MiniMax with the
# flags it always wants, without retyping them.
_preset_name="minimax"
_preset_label="MiniMax-M2.7 on its own, with the proxy"
_preset_entries=(
    "minimax 1 --proxy"
)
add_preset


# WRS: the two models, with how they are reached left to the command line —
#
#   llmctl preset wrs --host 0.0.0.0 --clear-logs
#
# so the same set can be brought up local or LAN-wide without a second preset.
# Note that a 0.0.0.0 listener carries no authentication unless --public is added;
# start warns about it. --cache-ram 0 keeps the host-RAM prompt cache out
# entirely: host RAM is the pool these two models already fill almost to the
# GPU's limit (below), so there is nothing to spare for it.
#
# --spec off on llama3.3 is asked for here, and it is the expensive kind of
# saving: the draft is 1.0 GiB of weights and buys 2.7x — 3.85 t/s plain against
# 10.34 with it, measured (see models.conf). It is the cheapest gigabyte on this
# machine to give back, and the one that costs the most.
#
# It fits, but only just. Measured with both models loaded, under the old split
# (96 GiB VRAM, 8 GiB GTT, ttm.pages_limit=2097152):
#
#   VRAM  95.3 of 96.0 GiB      0.7 GiB left
#   GTT    6.5 of  8.0 GiB      host RAM over PCIe
#          -----
#         101.8 GiB total, of which 94.5 GiB are the weights (file sizes,
#         40.6 + 53.9), leaving 7.3 GiB for both KV caches and every buffer
#
# Estimating this beforehand from the KB/token notes in models.conf plus a buffer
# allowance came to 105.3 GiB — 3.5 GiB too pessimistic, because both the
# per-token figures and the allowance are rough. Trust the measurement, not the
# arithmetic.
#
# Under today's split (1 GiB VRAM, up to 104 GiB GTT) the same 101.8 GiB all land
# in GTT — computed, not re-measured: ~2 GiB under the GTT limit, and ~23 GiB of
# the 124.4 left for the system. Still no headroom worth the name: raising either
# context runs into the limit, and every GiB of GTT is one the system loses.
#
# The draft was left out because it did not fit: ~1.5 GiB with its own KV put GTT
# at exactly the old 8 GiB ceiling. Under the 104 GiB limit it would come to
# ~103.3 GiB — in, on paper, with well under a GiB to spare, so --spec off stays
# until a measurement says otherwise. It costs the measured 10.34 -> 3.85 t/s.
#
# For a pair with actual headroom: llama3.3 alone used ~63 GiB (96 - 32.9, old
# measurement), which leaves ~41 GiB of the 104 beside it — gemma-moe (25.0),
# muse (27.6) or qwen (29.3), and the draft can stay.
_preset_name="wrs"
_preset_label="Qwen3.6-35B MoE and Llama-3.3-70B together (~102 of 104 GiB GTT, no headroom)"
_preset_entries=(
    "qwen-moe 1 --no-reasoning --cache-ram 0"
    "llama3.3 2 --cache-ram 0 --spec off"
)
add_preset

# Qwen3.8-Flash-Next on halogen, alone — as every halogen model must be.
# The entry in models.conf already carries the tuned defaults (256K context, a
# pool of the same size, 2 slots), and the proxy that translates the Messages
# API for Claude Code starts with it on its own.
#
# --mmproj loads the vision tower, so Claude Code can read screenshots. It costs
# ~0.84 GiB and changes nothing for text: without an image the server's output
# is byte-identical either way.
_preset_name="flash"
_preset_label="Qwen3.8-Flash-Next 125B MoE on halogen (exclusive, 256K, vision)"
_preset_entries=(
    "flash 1 --mmproj"
)
add_preset

# ComfyUI alone, with the whole machine for FLUX.2 dev (~105 GB with its working
# memory). Beside an LLM it runs as well — add "comfy 9" to any preset whose models
# leave room for the workflows you use; every LLM start unloads ComfyUI's models
# first, and they load again with the next image.
_preset_name="comfy"
_preset_label="ComfyUI alone (FLUX.2 dev needs nearly all of the memory)"
_preset_entries=(
    "comfy 9"
)
add_preset
