# Apache vhost for the VPS.
#
# Terminates the public Let's Encrypt TLS and forwards each path over a mutually
# authenticated TLS tunnel to stunnel on the LLM machine, which hands it to
# llama-server (:800N) or proxy.py (:808N) on 127.0.0.1.
#
# Install:
#   a2enmod proxy proxy_http ssl headers
#   mkdir -p /etc/apache2/llm
#   scp <llm-host>:~/.config/llm/tls/{ca.pem,vps-client-combined.pem} /etc/apache2/llm/
#   chmod 600 /etc/apache2/llm/vps-client-combined.pem     # contains a private key
#   a2ensite vps-llm-vhost && apachectl configtest && systemctl reload apache2
#
# NOTE: this vhost deliberately carries NO authentication. Tokens are checked by
# llama-server and proxy.py at the far end. Do not add AuthType Basic here — it
# would consume the Authorization header that OpenAI/Anthropic clients use to
# carry their token, and every request would fail.

# The hostname in the server certificate's SAN — the name passed to
# `run.sh gen-certs` — pointing at your router via DynDNS.
Define LLM_HOME  llm-home.example.org
Define LLM_TLS   /etc/apache2/llm

<VirtualHost *:443>
    ServerName llm.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/llm.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/llm.example.org/privkey.pem

    # ── Tunnel to the LLM machine ────────────────────────────────────────────
    SSLProxyEngine on
    # Accept only a server certificate signed by our own CA, with a matching name.
    SSLProxyCACertificateFile ${LLM_TLS}/ca.pem
    SSLProxyVerify            require
    SSLProxyCheckPeerName     on
    SSLProxyCheckPeerExpire   on
    # Our client certificate. stunnel runs verifyPeer, so without this the
    # handshake never completes — which is what keeps scanners off the port.
    SSLProxyMachineCertificateFile ${LLM_TLS}/vps-client-combined.pem

    # ── Streaming ────────────────────────────────────────────────────────────
    # A generation runs for minutes and streams token by token; matches the
    # llama-server --timeout 600 that run.sh sets.
    ProxyTimeout 600
    Timeout      600
    # Compression buffers SSE and stalls the stream until the response ends.
    SetEnv no-gzip 1

    # ── Endpoints ────────────────────────────────────────────────────────────
    # /sN/direct → llama-server, no prompt rewriting
    # /sN/cached → proxy.py, normalizes time/date stamps to keep the cache warm
    #              (only reachable if the slot was started with --proxy)
    # The trailing slashes matter — they strip the prefix before forwarding.
    ProxyPass        /s1/direct/ https://${LLM_HOME}:8441/
    ProxyPassReverse /s1/direct/ https://${LLM_HOME}:8441/
    ProxyPass        /s1/cached/ https://${LLM_HOME}:8451/
    ProxyPassReverse /s1/cached/ https://${LLM_HOME}:8451/

    # Slot 2 → 8442 / 8452, slot 3 → 8443 / 8453. Add only what you forward
    # at the router; an unforwarded port here just yields 503.

    ProxyPreserveHost Off

    ErrorLog  ${APACHE_LOG_DIR}/llm-error.log
    CustomLog ${APACHE_LOG_DIR}/llm-access.log combined
</VirtualHost>

# Clients then use:
#   OPENAI_BASE_URL=https://llm.example.org/s1/cached/v1
#   OPENAI_API_KEY=<token from ~/.config/llm/tokens on the LLM machine>
# or, for the unfiltered endpoint, /s1/direct/v1.
