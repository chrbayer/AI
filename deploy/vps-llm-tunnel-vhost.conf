# Apache vhost for LLM slots reached through a reverse tunnel (#32).
#
#   Client ──443/LE, token──► Apache on the server ──► 127.0.0.1:1808N  slot N's proxy
#   (127.0.0.1 on the server is the far end of `llmctl start <model> N --tunnel`)
#
# The machine running the models needs no open port: llmctl's autossh connects
# out and opens -R 1808N on the server (the slot's 808N + LLMCTL_TUNNEL_PORT_OFFSET,
# 10000 by default), bound to its loopback only — the slot's proxy, never the model
# server itself. Ports apart from the ones at home (808N), which a server may
# use for something of its own (code-server on 8083, say).
#
# No Basic Auth here: the token is the login. OpenAI clients send it as
# `Authorization: Bearer <token>`, Anthropic clients (Claude Code) as
# `x-api-key`; both pass through untouched, and the proxy — and for llama.cpp
# the server too — checks it against ~/.config/llmctl/tokens. The proxy also
# keeps to a path allowlist (/v1/chat/completions, /v1/messages, /v1/models,
# /v1/embeddings, /v1/rerank, /v1/audio/speech, /v1/audio/transcriptions, …),
# caps concurrent requests, and fetches http(s) image URLs itself, from public
# hosts only.
#
# Install (Arch layout, as on the server; Debian: /etc/apache2, a2enmod/a2ensite),
# alike the comfy vhost:
#   - modules: proxy proxy_http ssl headers
#   - DNS for the name below, then a certificate: certbot certonly --webroot … -d llm.example.org
#   - Include this file from httpd.conf (or conf/extra/), apachectl configtest, systemctl reload httpd
# On the model machine:
#   echo user@server > ~/.config/llmctl/tunnel-host       (the same as for comfy)
#   umask 077 && openssl rand -hex 32 > ~/.config/llmctl/tokens
#   llmctl start qwen 1 --tunnel
# A client then uses https://llm.example.org/s1/v1 as its OpenAI base URL, or
# https://llm.example.org/s1 as its Anthropic base URL, with a token as the key.
#
# Slot N → /sN/ → 127.0.0.1:1808N, for slots 1–9 (one pattern below); a slot
# above 9 needs its own ProxyPass line (slot 12: /s12/ → 127.0.0.1:18092/).

Define LLM_NAME  llm.example.org

<VirtualHost *:443>
    ServerName ${LLM_NAME}

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/${LLM_NAME}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${LLM_NAME}/privkey.pem

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=15552000"
    </IfModule>

    # ── Long answers, streamed ───────────────────────────────────────────────
    # A full 256K prefill on halogen alone takes minutes; reasoning answers too.
    ProxyTimeout 3600
    Timeout      3600
    # Streamed answers (SSE) must not wait in a compression buffer.
    SetEnv no-gzip 1
    SetEnv proxy-sendchunked 1
    # As much as the proxy takes (LLM_MAX_BODY_BYTES, 32 MiB): images, audio.
    LimitRequestBody 33554432

    # ── Routing ──────────────────────────────────────────────────────────────
    ProxyRequests     Off
    ProxyPreserveHost Off
    # flushpackets: each event goes out as it comes, not in 8 KB chunks.
    ProxyPassMatch "^/s([1-9])/(.*)$" "http://127.0.0.1:1808$1/$2" flushpackets=on
    # A slot above 9, e.g. slot 12:
    # ProxyPass        /s12/ http://127.0.0.1:18092/ flushpackets=on
    # ProxyPassReverse /s12/ http://127.0.0.1:18092/

    # With a slot's tunnel down (not started with --tunnel) its path answers 503.

    ErrorLog  /var/log/httpd/llm-error.log
    CustomLog /var/log/httpd/llm-access.log combined
</VirtualHost>
