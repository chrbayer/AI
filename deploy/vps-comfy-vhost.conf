# Apache vhost for ComfyUI and its repair page, reached through a reverse tunnel.
#
#   Browser ──443/LE + Basic Auth──► Apache on the server ──► 127.0.0.1:18009  ComfyUI
#                                                         ├─► 127.0.0.1:18089  image API: /repair, /v1/images
#                                                         └─► 127.0.0.1:18190  /darkroom (llmctl darkroom)
#   (127.0.0.1 on the server is the far end of `llmctl start comfy 9 --proxy --tunnel`,
#    and of `llmctl darkroom enable`, which keeps its own tunnel up with ComfyUI stopped)
#
# The machine running ComfyUI needs no open port: llmctl's autossh connects out
# and opens -R 18009 and -R 18089 on the server, bound to its loopback only —
# the ports here (8009, 8089) plus LLMCTL_TUNNEL_PORT_OFFSET (10000), apart
# from whatever the server runs on its own 80xx ports.
#
# ComfyUI has no login of its own — whoever reaches it runs workflows and
# uploads files — so this vhost puts Basic Auth in front of everything. The
# repair page calls the image API (/v1/images/…) from the browser, which sends
# the same credentials; an OpenAI client from outside does not, so the API
# stays closed to it.
#
# Install (Arch layout, as on the server; Debian: /etc/apache2, a2enmod/a2ensite):
#   - modules: proxy proxy_http proxy_wstunnel ssl headers, and for the login
#     auth_basic authn_core authn_file authz_user authz_core — authn_file is the
#     one that reads the htpasswd file; without it Apache does not know
#     AuthUserFile (Arch ships it commented out in httpd.conf)
#   - DNS for the name below, then a certificate: certbot certonly --webroot … -d comfy.example.org
#   - htpasswd -c -B /etc/httpd/conf/comfy.htpasswd <user>
#   - Include this file from httpd.conf (or conf/extra/), apachectl configtest, systemctl reload httpd
# On the ComfyUI machine:
#   echo user@server > ~/.config/llmctl/tunnel-host
#   llmctl start comfy 9 --proxy --vision 2 --tunnel
#
# Slot 9 → ports 18009 (UI) and 18089 (image API); another slot N uses 1800N / 1808N.
#
# The phone page: `llmctl darkroom enable` there, and the line `llmctl darkroom key`
# prints into this server's ~/.ssh/authorized_keys (its key may open that one
# forward, nothing else).

Define COMFY_NAME  comfy.example.org
Define COMFY_UI    http://127.0.0.1:18009
Define COMFY_WS    ws://127.0.0.1:18009
Define COMFY_API   http://127.0.0.1:18089
Define DARKROOM    http://127.0.0.1:18190

<VirtualHost *:443>
    ServerName ${COMFY_NAME}

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/${COMFY_NAME}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${COMFY_NAME}/privkey.pem

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=15552000"
    </IfModule>

    # ── Login ────────────────────────────────────────────────────────────────
    <Location />
        AuthType Basic
        AuthName "ComfyUI"
        AuthUserFile /etc/httpd/conf/comfy.htpasswd
        Require valid-user
    </Location>
    # Darkroom keeps a history per login: the login passed on to it (a header
    # of that name sent by the browser is overwritten). Without this line all
    # logins share one history.
    <Location /darkroom>
        RequestHeader set X-Remote-User "%{REMOTE_USER}s"
    </Location>

    # ── Long jobs, big pictures ──────────────────────────────────────────────
    # FLUX.2 dev edits take ~20 min; a check with the vision model minutes.
    ProxyTimeout 3600
    Timeout      3600
    # Uploads and the repair page's pictures (sent as data URLs).
    LimitRequestBody 209715200

    # ── Routing ──────────────────────────────────────────────────────────────
    # Host and Origin stay what the browser sent: ComfyUI compares them.
    ProxyPreserveHost On
    ProxyRequests     Off

    # The repair page and the image API it calls — before the catch-all.
    ProxyPass        /repair     ${COMFY_API}/repair
    ProxyPassReverse /repair     ${COMFY_API}/repair
    ProxyPass        /v1/images/ ${COMFY_API}/v1/images/
    ProxyPassReverse /v1/images/ ${COMFY_API}/v1/images/

    # The phone page, its own service with its own tunnel: there when ComfyUI is not.
    ProxyPass        /darkroom   ${DARKROOM}/darkroom
    ProxyPassReverse /darkroom   ${DARKROOM}/darkroom
    # Its old address (until llmctl 1.86): the page sends it on to /darkroom.
    ProxyPass        /fotos      ${DARKROOM}/fotos
    ProxyPassReverse /fotos      ${DARKROOM}/fotos

    # ComfyUI's websocket (progress, previews), then everything else.
    ProxyPass        /ws         ${COMFY_WS}/ws
    ProxyPassReverse /ws         ${COMFY_WS}/ws
    ProxyPass        /           ${COMFY_UI}/
    ProxyPassReverse /           ${COMFY_UI}/

    # With the tunnel down (ComfyUI not started) this answers 503.

    ErrorLog  /var/log/httpd/comfy-error.log
    CustomLog /var/log/httpd/comfy-access.log combined
</VirtualHost>
