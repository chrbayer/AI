# What `llmctl outdated` watches for beyond the files in use (section "Watch").
#
#   model  <hf author>  <regex on the repo name, group 1 = version>  <version in use>  <label>
#     a repo of that author whose version is higher than the one in use is reported
#   template  <regex on ComfyUI's template names>  <issue>  <what it would bring>
#     a template that matches (ComfyUI updates bring new ones) is reported with the issue
#     that waits for it
model     Lightricks         ^LTX-(\d+(?:\.\d+)?)(?:-|$)                2.5   LTX video
model     Qwen               ^Qwen-Image-(\d\.\d+)(?:-|$)               2.1   Qwen-Image
model     Tongyi-MAI         ^Z-Image-(\d+(?:\.\d+)?)(?:-|$)            0     Z-Image (a numbered successor)
model     black-forest-labs  ^FLUX\.(\d+)                               2     FLUX
model     ACE-Step           ^acestep-v(\d+)(?:-|$)                     15    ACE-Step (v15 = 1.5)
model     microsoft          ^TRELLIS\.(\d+)                            2     TRELLIS 3D
model     stabilityai        ^stable-audio-(\d+)(?:-|$)                 3     Stable Audio
template  ^video_ltx2_5_.*ia2v                         #43  talking avatar on LTX-2.5 (picture + audio)
template  ^video_ltx2_5_.*(id_lora|ic_lora)            #45  identity/IC-LoRA workflows for LTX-2.5
template  ^video_ltx2_5_.*(canny|depth|pose)           #45  control to video for LTX-2.5
template  ^video_wan2_[2-9].*vace                      #46  a newer Wan VACE
