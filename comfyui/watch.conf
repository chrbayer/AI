# What `llmctl outdated` watches for beyond the files in use (section "Watch").
#
#   model  <hf author>  <regex on the repo name, group 1 = version>  <version in use>  <label>
#     a repo of that author whose version is higher than the one in use is reported
#   new  <hf author>  <regex on the repo name>  <known repos, comma-separated>  <label>
#     a matching repo not among the known ones is reported (new models without a
#     version number of their own, e.g. halogen checkpoints for other base models)
#   template  <regex on ComfyUI's template names>  <issue>  <what it would bring>
#     a template that matches (ComfyUI updates bring new ones) is reported with the issue
#     that waits for it
#
# Only successors of what is in use count as news here: a different model of a family
# (Llama 4 beside Llama 3.3), a new generation with another make-up (MiniMax-M3 beside
# M2.7) or another engine for a model (a halogen checkpoint) is something to try, not
# an update — those go into issues, not into this list.
# Uncensored community builds of a new base model come later and from other authors;
# the base release is the signal to go looking.

# Language models
model     Qwen               ^Qwen(\d+\.\d+)-(?!.*(TTS|ASR|Embedding|Reranker|VL|Image|Omni|Coder))   3.8   Qwen LLM (qwen, qwen-moe, flash)
model     google             ^gemma-(\d+)-                              4     Gemma (gemma, gemma-moe)
model     deepseek-ai        ^DeepSeek-R(\d+)(?:-|$)                    1     DeepSeek R (r1)
# Speech, embeddings
model     Qwen               ^Qwen(\d+(?:\.\d+)?)-TTS                   3     Qwen TTS (speech, ComfyUI voices)
model     Qwen               ^Qwen(\d+(?:\.\d+)?)-(?:VL-)?Embedding     3     Qwen Embedding (embed)
# Pictures, video, 3D, music
model     Lightricks         ^LTX-(\d+(?:\.\d+)?)(?:-|$)                2.5   LTX video
model     Qwen               ^Qwen-Image-(\d\.\d+)(?:-|$)               2.1   Qwen-Image
model     Tongyi-MAI         ^Z-Image-(\d+(?:\.\d+)?)(?:-|$)            0     Z-Image (a numbered successor)
model     black-forest-labs  ^FLUX\.(\d+)                               2     FLUX
model     ByteDance-Seed     ^SeedVR(\d+)-                              2     SeedVR (upscaling)
model     facebook           ^sam(\d+(?:\.\d+)?)(?:-|$)                 3.1   SAM (masks from words)
model     microsoft          ^Florence-(\d+)-                           2     Florence (captions)
model     microsoft          ^TRELLIS\.(\d+)                            2     TRELLIS 3D
model     ACE-Step           ^acestep-v(\d+)(?:-|$)                     15    ACE-Step (v15 = 1.5)
model     m-a-p              ^YuE(\d+)-                                 2     YuE
model     stabilityai        ^stable-audio-(\d+)(?:-|$)                 3     Stable Audio
# ComfyUI templates open issues wait for
template  ^video_ltx2_5_.*ia2v                         #43  talking avatar on LTX-2.5 (picture + audio)
template  ^video_ltx2_5_.*(id_lora|ic_lora)            #45  identity/IC-LoRA workflows for LTX-2.5
template  ^video_ltx2_5_.*(canny|depth|pose)           #45  control to video for LTX-2.5
template  ^video_wan2_[2-9].*vace                      #46  a newer Wan VACE
